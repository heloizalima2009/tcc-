<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio Lima | Fotografia</title>
    <!-- Google Fonts para tipografia elegante -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
       
    <link rel="stylesheet" href="../css/fotografia.css">
</head>
<body>

   
    <header class="hero">
        <div class="overlay"></div>
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <h1>ESTÚDIO</h1>
                    <span>LIMA</span>
                </div>
                <ul class="nav-links">
                    <li><a href="#portfolio">PORTFÓLIO</a></li>
                    <li><a href="#servicos">SERVIÇOS</a></li>
                    <li><a href="#sobre">SOBRE</a></li>
                    <li><a href="#contato">CONTATO</a></li>
                </ul>
            </nav>
            
            
            <div class="hero-content">  
                <h2>ETERNIZAR</h2>
                <p>Visão artística, Execução impecável</p>
                <a href="#portfolio" class="btn-primary">VER PORTFÓLIO</a>
            </div>
        </div>
        

    </header>

    <section class="stats">
        <div class="container stats-grid">
            <div class="stat-item">
                <h3 class="counter" data-target="2400">0</h3>
                <span class="plus">+</span>
                <p>SESSÕES REALIZADAS</p>
            </div>
            <div class="divider"></div>
            <div class="stat-item">
                <h3 class="counter" data-target="320">0</h3>
                <span class="plus">+</span>
                <p>CASAMENTOS</p>
            </div>
            <div class="divider"></div>
            <div class="stat-item">
                <h3 class="counter" data-target="100">0</h3>
                <span class="percent">%</span>
                <p>SATISFAÇÃO</p>
            </div>
        </div>
    </section>

    <section id="portfolio" class="gallery">
        <div class="container gallery-grid"> 
            <div class="gallery-item">
                <img src="" alt="Retrato Feminino">
            </div>
            <div class="gallery-item">
                <img src="../images/image.png" alt="Casamento">
            </div>
            <div class="gallery-item">
                <img src="https://unsplash.com" alt="Casal">
            </div>
        </div>
    </section>

    <footer id="contato" class="footer">
        <div class="footer-overlay"></div>
        <div class="container footer-content">
            <div class="footer-logo">
                <h2>ÉSTÚDIO LIMA</h2>
            </div>
        </div>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
