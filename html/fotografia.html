<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto Safari - Lente Rápida</title>
    <!-- Volta uma pasta e entra em css/ -->
    <link rel="stylesheet" href="../css/safari.css">
</head>
<body>

    <div class="game-wrapper">
        <!-- Lado Esquerdo: Personagem -->
        <div class="character-container">
            <div class="character-box">
                <img src="https://unsplash.com" alt="Fotógrafa Segurando Câmera" class="character-img">
            </div>
            <div class="character-bubble" id="safari-dialog">
                "Câmera na mão e foco pronto! Clique nos alvos assim que eles surgirem na lente!"
            </div>
        </div>

        <!-- Lado Direito: Tela do Jogo -->
        <div class="game-container">
            <h1>📸 Caçador de Cliques</h1>
            
            <div class="score-board">
                <span>Pontos: <strong id="safari-score">0</strong></span>
                <span>Tempo: <strong id="safari-timer">15s</strong></span>
            </div>

            <div class="safari-zone" id="safariZone">
                <div class="flash-overlay" id="flashOverlay"></div>
            </div>

            <div class="controls">
                <button id="start-safari-btn" class="btn-start">▶ INICIAR SESSÃO</button>
            </div>
        </div>
    </div>

    <!-- Volta uma pasta e entra em js/ -->
    <script src="../js/safari.js"></script>
</body>
</html>
